<text x="788.0" y="151.5" font-size="11" text-anchor="middle" fill="#52514e">a separate model</text>
<text x="788.0" y="166.5" font-size="11" text-anchor="middle" fill="#52514e">grades each stage</text>
<line x1="652" y1="77" x2="696" y2="148" stroke="#c9c9c4" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="4 3"/>
<line x1="652" y1="143" x2="696" y2="148" stroke="#c9c9c4" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="4 3"/>
