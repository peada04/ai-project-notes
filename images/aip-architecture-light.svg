<text x="295.0" y="336.0" font-size="11" text-anchor="middle" fill="#52514e">semantic search</text>
<line x1="481" y1="282" x2="481" y2="298" stroke="#c9c9c4" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="396" y="300" width="170" height="50" rx="7" fill="#e9f8f2" stroke="#1baf7a" stroke-width="1.5"/>
<text x="481.0" y="321.0" font-size="12.5" text-anchor="middle" fill="#0b0b0b" font-weight="600">Graph</text>
<text x="481.0" y="336.0" font-size="11" text-anchor="middle" fill="#52514e">how things relate</text>
<text x="700" y="268" font-size="11.5" font-weight="600" fill="#52514e" letter-spacing="0.6">OUTPUTS</text>
<line x1="566" y1="325" x2="696" y2="325" stroke="#c9c9c4" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="700" y="300" width="176" height="50" rx="7" fill="none" stroke="#c9c9c4" stroke-width="1.5"/>
<text x="788.0" y="321.0" font-size="11" text-anchor="middle" fill="#52514e">Report, podcast, and</text>
<text x="788.0" y="336.0" font-size="11" text-anchor="middle" fill="#52514e">questions asked later</text>
<text x="24" y="382" font-size="11" fill="#52514e">Conceptual: component kinds, not an inventory. The stages and the walls between them are the point.</text>
</svg>