<text x="24" y="268" font-size="11.5" font-weight="600" fill="#52514e" letter-spacing="0.6">IT ACCUMULATES</text>
<line x1="501" y1="240" x2="501" y2="282" stroke="#c9c9c4" stroke-width="1.4"/>
<line x1="109" y1="282" x2="481" y2="282" stroke="#c9c9c4" stroke-width="1.4"/>
<line x1="109" y1="282" x2="109" y2="298" stroke="#c9c9c4" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="24" y="300" width="170" height="50" rx="7" fill="#e9f8f2" stroke="#1baf7a" stroke-width="1.5"/>
<text x="109.0" y="321.0" font-size="12.5" text-anchor="middle" fill="#0b0b0b" font-weight="600">Relational</text>
<text x="109.0" y="336.0" font-size="11" text-anchor="middle" fill="#52514e">facts and metrics</text>
<line x1="295" y1="282" x2="295" y2="298" stroke="#c9c9c4" stroke-width="1.6" marker-end="url(#a)"/>
