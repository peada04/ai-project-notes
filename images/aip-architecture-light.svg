<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 402" width="900" height="402" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="Conceptual architecture. Public web research and internal material are both passed through a guard, then through three separate stages with walls between them: observations anchored to sources, metrics derived from those observations, and inferences drawn on top. A separate judge model grades each stage. The results accumulate into relational, vector and graph stores, which feed the report, the podcast, and questions asked of the store later.">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c9c9c4"/></marker></defs>
<text x="24" y="30" font-size="11.5" font-weight="600" fill="#52514e" letter-spacing="0.6">INPUTS</text>
<rect x="24" y="44" width="150" height="52" rx="7" fill="none" stroke="#c9c9c4" stroke-width="1.5"/>
<text x="99.0" y="66.0" font-size="12.5" text-anchor="middle" fill="#0b0b0b" font-weight="600">Public web research</text>
<text x="99.0" y="81.0" font-size="11" text-anchor="middle" fill="#52514e">search and retrieval</text>
<rect x="24" y="112" width="150" height="52" rx="7" fill="none" stroke="#c9c9c4" stroke-width="1.5"/>
<text x="99.0" y="134.0" font-size="12.5" text-anchor="middle" fill="#0b0b0b" font-weight="600">Internal material</text>
<text x="99.0" y="149.0" font-size="11" text-anchor="middle" fill="#52514e">chunked and embedded</text>
<line x1="174" y1="70" x2="186" y2="70" stroke="#c9c9c4" stroke-width="1.4"/>
<line x1="174" y1="138" x2="186" y2="138" stroke="#c9c9c4" stroke-width="1.4"/>
<line x1="186" y1="70" x2="186" y2="138" stroke="#c9c9c4" stroke-width="1.4"/>
<line x1="186" y1="104" x2="202" y2="104" stroke="#c9c9c4" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="206" y="81" width="104" height="46" rx="7" fill="none" stroke="#c9c9c4" stroke-width="1.5"/>
<text x="258.0" y="100.0" font-size="12.5" text-anchor="middle" fill="#0b0b0b" font-weight="600">Guard</text>
<text x="258.0" y="115.0" font-size="11" text-anchor="middle" fill="#52514e">untrusted text</text>
<line x1="310" y1="104" x2="330" y2="132" stroke="#c9c9c4" stroke-width="1.6" marker-end="url(#a)"/>
<text x="336" y="30" font-size="11.5" font-weight="600" fill="#52514e" letter-spacing="0.6">THREE SEPARATE STAGES</text>
<rect x="336" y="40" width="330" height="200" rx="9" fill="none" stroke="#c9c9c4" stroke-dasharray="4 4" stroke-width="1"/>
<rect x="350" y="52" width="302" height="50" rx="7" fill="#eef4fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="501.0" y="73.0" font-size="12.5" text-anchor="middle" fill="#0b0b0b" font-weight="600">Observations</text>
<text x="501.0" y="88.0" font-size="11" text-anchor="middle" fill="#52514e">anchored to a source</text>
<rect x="350" y="118" width="302" height="50" rx="7" fill="#eef4fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="501.0" y="139.0" font-size="12.5" text-anchor="middle" fill="#0b0b0b" font-weight="600">Derived metrics</text>
<text x="501.0" y="154.0" font-size="11" text-anchor="middle" fill="#52514e">measured, estimated or absent</text>
<rect x="350" y="184" width="302" height="50" rx="7" fill="#eef4fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="501.0" y="205.0" font-size="12.5" text-anchor="middle" fill="#0b0b0b" font-weight="600">Inferences</text>
<text x="501.0" y="220.0" font-size="11" text-anchor="middle" fill="#52514e">what to do about it</text>
<line x1="386" y1="110" x2="652" y2="110" stroke="#c9c9c4" stroke-width="1.4" stroke-dasharray="3 3"/>
<text x="352" y="113" font-size="10" fill="#52514e">wall</text>
<line x1="501" y1="102" x2="501" y2="124" stroke="#c9c9c4" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="386" y1="176" x2="652" y2="176" stroke="#c9c9c4" stroke-width="1.4" stroke-dasharray="3 3"/>
<text x="352" y="179" font-size="10" fill="#52514e">wall</text>
